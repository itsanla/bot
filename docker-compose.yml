services:
  bot:
    image: itsanla/bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itsanla-bot
    restart: unless-stopped
    ports:
      - "5005:5005"
    extra_hosts:
      # HERMES_WEBHOOK_URL=http://host.docker.internal:6005/... menjangkau gateway Hermes di host
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=5005
      - DB_PATH=/app/data/bot.db
    volumes:
      - ./data:/app/data
